<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Exam Manager — Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);color:#e2e8f0;overflow:hidden}
        .bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(circle at 1px 1px,rgba(148,163,184,0.08) 1px,transparent 0);background-size:40px 40px;z-index:0}
        .login-container{position:relative;z-index:1;width:100%;max-width:440px;padding:20px}
        .login-card{background:rgba(30,41,59,0.8);backdrop-filter:blur(20px);border:1px solid rgba(148,163,184,0.1);border-radius:20px;padding:48px 40px;box-shadow:0 25px 50px rgba(0,0,0,0.4)}
        .logo{text-align:center;margin-bottom:32px}
        .logo i{font-size:48px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:12px;display:block}
        .logo h1{font-size:24px;font-weight:700;letter-spacing:-0.5px}
        .logo h1 span{background:linear-gradient(135deg,#3b82f6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .logo p{color:#94a3b8;font-size:13px;margin-top:4px}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;color:#94a3b8;font-size:13px;font-weight:500;margin-bottom:8px}
        .input-wrapper{position:relative}
        .input-wrapper i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#64748b;font-size:14px}
        .input-wrapper input{width:100%;padding:14px 14px 14px 42px;background:rgba(15,23,42,0.6);border:1px solid rgba(148,163,184,0.15);border-radius:12px;color:#e2e8f0;font-size:14px;transition:all 0.3s;outline:none;font-family:'Inter',sans-serif}
        .input-wrapper input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,0.15)}
        .input-wrapper input::placeholder{color:#475569}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:'Inter',sans-serif;margin-top:8px}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(59,130,246,0.3)}
        .login-btn:active{transform:translateY(0)}
        .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:20px;display:none;align-items:center;gap:8px}
        .error-msg i{color:#ef4444}
        .credentials{margin-top:28px;padding-top:24px;border-top:1px solid rgba(148,163,184,0.1)}
        .credentials h4{color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;text-align:center}
        .cred-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(15,23,42,0.4);border-radius:8px;margin-bottom:6px;cursor:pointer;transition:background 0.2s}
        .cred-item:hover{background:rgba(59,130,246,0.1)}
        .cred-icon{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
        .cred-icon.admin{background:linear-gradient(135deg,#3b82f6,#2563eb)}
        .cred-icon.teacher{background:linear-gradient(135deg,#10b981,#059669)}
        .cred-icon.staff{background:linear-gradient(135deg,#f59e0b,#d97706)}
        .cred-info{flex:1}
        .cred-info .role{font-size:12px;font-weight:600;color:#e2e8f0}
        .cred-info .detail{font-size:11px;color:#64748b}
        .pulse{animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <i class="fas fa-brain"></i>
                <h1><span>AI</span> EXAM MANAGER</h1>
                <p>Smart Examination Management System</p>
            </div>

            <div class="error-msg" id="errorMsg">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">Invalid credentials</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
            </form>

            <div class="credentials">
                <h4>Quick Login</h4>
                <div class="cred-item" onclick="fillCreds('AdminPro','admin@123')">
                    <div class="cred-icon admin"><i class="fas fa-shield-halved"></i></div>
                    <div class="cred-info">
                        <div class="role">Admin</div>
                        <div class="detail">AdminPro / admin@123</div>
                    </div>
                </div>
                <div class="cred-item" onclick="fillCreds('Teacher','teacher@456')">
                    <div class="cred-icon teacher"><i class="fas fa-chalkboard-teacher"></i></div>
                    <div class="cred-info">
                        <div class="role">Teacher / Invigilator</div>
                        <div class="detail">Teacher / teacher@456</div>
                    </div>
                </div>
                <div class="cred-item" onclick="fillCreds('Staff','staff@789')">
                    <div class="cred-icon staff"><i class="fas fa-user-tie"></i></div>
                    <div class="cred-info">
                        <div class="role">Non-Teaching Staff</div>
                        <div class="detail">Staff / staff@789</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCreds(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('errorMsg');
            const errText = document.getElementById('errorText');

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    errText.textContent = data.message || 'Invalid credentials';
                    errDiv.style.display = 'flex';
                    setTimeout(() => errDiv.style.display = 'none', 4000);
                }
            } catch (err) {
                errText.textContent = 'Connection error. Please try again.';
                errDiv.style.display = 'flex';
            }
        });
    </script>
</body>
</html>
